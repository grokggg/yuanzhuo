name: UHES CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          # 项目零第三方依赖(纯标准库),仅验证语法

      - name: 语法编译检查
        run: |
          python -m compileall src/
          echo "✅ 全部 .py 编译通过"

      - name: 集成测试矩阵(14 用例, mock 离线)
        run: |
          cd src && python3 main.py --test suite

      - name: 冻结校验(核心骨架未动)
        run: |
          cd src && python3 main.py --frozen-check

      - name: 阶段 2/3/4 能力回归
        run: |
          cd src
          python3 main.py --test phase2
          python3 main.py --test phase3
          python3 main.py --test phase4

      - name: 100 用户压测(20 用户快速版, mock)
        run: |
          cd src && python3 user_simulator.py --count 20

      - name: 主流程全链路
        run: |
          cd src && python3 main.py
